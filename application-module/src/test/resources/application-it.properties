spring.datasource.url=${IT_DB_URL:jdbc:mysql://127.0.0.1:3306/lexho_user_service_it?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${IT_DB_USERNAME:root}
spring.datasource.password=${IT_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.flyway.enabled=false

spring.data.redis.host=${IT_REDIS_HOST:localhost}
spring.data.redis.port=${IT_REDIS_PORT:6379}
spring.cache.type=none

security.jwt.secret=${IT_JWT_SECRET:it-only-jwt-secret-minimum-32-characters}
