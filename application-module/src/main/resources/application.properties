server.port=8082
server.address=0.0.0.0

# =========================
# DATABASE
# =========================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/user_servicedb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:Muskaan@8756}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.open-in-view=false
spring.jpa.database-platform=${JPA_DIALECT:org.hibernate.dialect.MySQLDialect}
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.cloud.compatibility-verifier.enabled=false


# =========================
# APP CONFIG
# =========================
app.user.default-city=${APP_DEFAULT_CITY:Unknown}
app.home.primary-promo-label=${APP_HOME_PRIMARY_PROMO_LABEL:Limited Offer}
app.home.primary-cta-label=${APP_HOME_PRIMARY_CTA_LABEL:Book Now}
app.home.secondary-cta-label=${APP_HOME_SECONDARY_CTA_LABEL:View Offers}
app.home.recommendation-tagline=${APP_HOME_RECOMMENDATION_TAGLINE:Next available slot soon}
app.home.fallback-greeting=${APP_HOME_FALLBACK_GREETING:Hi}
app.upload.base-dir=${APP_UPLOAD_BASE_DIR:uploads}
app.booking-service.url=${APP_BOOKING_SERVICE_URL:http://localhost:8082}
app.provider.documents.storage-provider=${APP_PROVIDER_DOCUMENTS_STORAGE_PROVIDER:local}


# =========================
# JWT CONFIG
# =========================
security.jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-key-min-32-bytes}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
security.jwt.issuer=${JWT_ISSUER:lexho-user-service}
security.jwt.audience=${JWT_AUDIENCE:lexho-clients}


# =========================
# REDIS CONFIG
# =========================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=${REDIS_TIMEOUT:2000ms}


# =========================
# MAIL CONFIG
# (for production later)
# =========================
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}


# =========================
# ADMIN OTP CONFIG
# =========================
admin.auth.otp.key-prefix=${ADMIN_OTP_KEY_PREFIX:ADMIN_OTP_}
admin.auth.otp.expiry-seconds=${ADMIN_OTP_EXPIRY_SECONDS:300}
admin.auth.otp.max-attempts=${ADMIN_OTP_MAX_ATTEMPTS:3}
admin.auth.otp.delivery-from=${ADMIN_OTP_EMAIL_FROM:no-reply@lexho.com}


# =========================
# PASSWORD SECURITY
# =========================
admin.auth.password.max-failed-attempts=${ADMIN_MAX_FAILED_PASSWORD_ATTEMPTS:5}
admin.auth.password.lock-duration-minutes=${ADMIN_LOCK_DURATION_MINUTES:30}


# =========================
# RATE LIMITING
# =========================
admin.auth.rate-limit.max-requests=${ADMIN_LOGIN_RATE_LIMIT_MAX_REQUESTS:10}
admin.auth.rate-limit.window-seconds=${ADMIN_LOGIN_RATE_LIMIT_WINDOW_SECONDS:60}
admin.auth.rate-limit.key-prefix=${ADMIN_LOGIN_RATE_LIMIT_KEY_PREFIX:ADMIN_LOGIN_RL_}


# =========================
# DEV FALLBACKS (IMPORTANT)
# =========================
admin.auth.infrastructure.allow-in-memory-otp-fallback=${ADMIN_ALLOW_IN_MEMORY_OTP_FALLBACK:true}
admin.auth.infrastructure.allow-in-memory-rate-limit-fallback=${ADMIN_ALLOW_IN_MEMORY_RATE_LIMIT_FALLBACK:true}
admin.auth.infrastructure.allow-console-otp-delivery-fallback=${ADMIN_ALLOW_CONSOLE_OTP_DELIVERY_FALLBACK:true}


# =========================
# ADMIN SEED
# =========================
admin.seed.enabled=${ADMIN_SEED_ENABLED:true}
admin.seed.email=${ADMIN_SEED_EMAIL:admin@lexho.com}
admin.seed.password=${ADMIN_SEED_PASSWORD:Admin@12345}


# =========================
# CORS
# =========================
app.security.cors.allowed-origins=${APP_ALLOWED_CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4200}
