server.port=8082
server.address=0.0.0.0
spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}
spring.config.import=optional:file:.env[.properties]

# =========================
# DATABASE
# =========================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/user_servicedb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.open-in-view=false
spring.jpa.database-platform=${JPA_DIALECT:org.hibernate.dialect.MySQLDialect}
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.cloud.compatibility-verifier.enabled=false


# =========================
# APP CONFIG
# =========================
app.user.default-city=${APP_DEFAULT_CITY:Unknown}
app.home.primary-promo-label=${APP_HOME_PRIMARY_PROMO_LABEL:Limited Offer}
app.home.primary-cta-label=${APP_HOME_PRIMARY_CTA_LABEL:Book Now}
app.home.secondary-cta-label=${APP_HOME_SECONDARY_CTA_LABEL:View Offers}
app.home.recommendation-tagline=${APP_HOME_RECOMMENDATION_TAGLINE:Next available slot soon}
app.home.fallback-greeting=${APP_HOME_FALLBACK_GREETING:Hi}
app.upload.base-dir=${APP_UPLOAD_BASE_DIR:uploads}
app.booking-service.url=${APP_BOOKING_SERVICE_URL:http://localhost:8082}
app.dispatch.radius-km=${APP_DISPATCH_RADIUS_KM:15}
app.dispatch.score.weight.distance=${APP_DISPATCH_SCORE_WEIGHT_DISTANCE:0.45}
app.dispatch.score.weight.pincode-match=${APP_DISPATCH_SCORE_WEIGHT_PINCODE_MATCH:0.25}
app.dispatch.score.weight.active-jobs=${APP_DISPATCH_SCORE_WEIGHT_ACTIVE_JOBS:0.15}
app.dispatch.score.weight.rating=${APP_DISPATCH_SCORE_WEIGHT_RATING:0.15}
app.dispatch.partner-offline-timeout-seconds=${APP_DISPATCH_PARTNER_OFFLINE_TIMEOUT_SECONDS:120}
app.dispatch.location-stale-timeout-minutes=${APP_DISPATCH_LOCATION_STALE_TIMEOUT_MINUTES:30}
app.dispatch.cleanup-interval-ms=${APP_DISPATCH_CLEANUP_INTERVAL_MS:60000}
app.api.legacy.customer-location.enabled=${APP_API_LEGACY_CUSTOMER_LOCATION_ENABLED:true}
app.api.legacy.partner-shift.enabled=${APP_API_LEGACY_PARTNER_SHIFT_ENABLED:true}
app.api.legacy.address-module.enabled=${APP_API_LEGACY_ADDRESS_MODULE_ENABLED:true}
app.geocode.reverse-url=${APP_GEOCODE_REVERSE_URL:https://nominatim.openstreetmap.org/reverse}
app.geocode.user-agent=${APP_GEOCODE_USER_AGENT:lexho-user-service/1.0}
app.mapbox.enabled=${APP_MAPBOX_ENABLED:false}
app.mapbox.access-token=${APP_MAPBOX_ACCESS_TOKEN:}
app.mapbox.geocoding-url=${APP_MAPBOX_GEOCODING_URL:https://api.mapbox.com/geocoding/v5/mapbox.places}
app.mapbox.directions-url=${APP_MAPBOX_DIRECTIONS_URL:https://api.mapbox.com/directions/v5/mapbox}
app.partner.documents.storage-partner=${APP_PROVIDER_DOCUMENTS_STORAGE_PROVIDER:local}
app.push.fcm.enabled=${APP_PUSH_FCM_ENABLED:false}
app.push.fcm.service-account-path=${APP_PUSH_FCM_SERVICE_ACCOUNT_PATH:}
app.push.fcm.service-account-base64=${APP_PUSH_FCM_SERVICE_ACCOUNT_BASE64:}
app.notification.email.enabled=${APP_NOTIFICATION_EMAIL_ENABLED:false}
app.notification.email.from=${APP_NOTIFICATION_EMAIL_FROM:no-reply@lexho.com}
app.notification.sms.enabled=${APP_NOTIFICATION_SMS_ENABLED:false}
app.notification.sms.gateway-url=${APP_NOTIFICATION_SMS_GATEWAY_URL:}
app.notification.sms.auth-token=${APP_NOTIFICATION_SMS_AUTH_TOKEN:}
app.notification.sms.sender-id=${APP_NOTIFICATION_SMS_SENDER_ID:LEXHO}
lexho.auth.otp.expiry-seconds=${LEXHO_AUTH_OTP_EXPIRY_SECONDS:300}
lexho.auth.otp.resend-after-seconds=${LEXHO_AUTH_OTP_RESEND_AFTER_SECONDS:30}
lexho.auth.refresh-token.expiry-days=${LEXHO_AUTH_REFRESH_TOKEN_EXPIRY_DAYS:30}


# =========================
# JWT CONFIG
# =========================
security.jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-key-min-32-bytes}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
security.jwt.issuer=${JWT_ISSUER:lexho-user-service}
security.jwt.audience=${JWT_AUDIENCE:lexho-clients}


# =========================
# REDIS CONFIG
# =========================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=${REDIS_TIMEOUT:2000ms}
spring.data.redis.repositories.enabled=false
spring.cache.type=simple


# =========================
# MAIL CONFIG
# (for production later)
# =========================
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}


# =========================
# ADMIN OTP CONFIG
# =========================
admin.auth.otp.key-prefix=${ADMIN_OTP_KEY_PREFIX:ADMIN_OTP_}
admin.auth.otp.expiry-seconds=${ADMIN_OTP_EXPIRY_SECONDS:300}
admin.auth.otp.max-attempts=${ADMIN_OTP_MAX_ATTEMPTS:3}
admin.auth.otp.delivery-from=${ADMIN_OTP_EMAIL_FROM:no-reply@lexho.com}


# =========================
# PASSWORD SECURITY
# =========================
admin.auth.password.max-failed-attempts=${ADMIN_MAX_FAILED_PASSWORD_ATTEMPTS:5}
admin.auth.password.lock-duration-minutes=${ADMIN_LOCK_DURATION_MINUTES:30}


# =========================
# RATE LIMITING
# =========================
admin.auth.rate-limit.max-requests=${ADMIN_LOGIN_RATE_LIMIT_MAX_REQUESTS:10}
admin.auth.rate-limit.window-seconds=${ADMIN_LOGIN_RATE_LIMIT_WINDOW_SECONDS:60}
admin.auth.rate-limit.key-prefix=${ADMIN_LOGIN_RATE_LIMIT_KEY_PREFIX:ADMIN_LOGIN_RL_}


# =========================
# DEV FALLBACKS (IMPORTANT)
# =========================
admin.auth.infrastructure.allow-in-memory-otp-fallback=${ADMIN_ALLOW_IN_MEMORY_OTP_FALLBACK:true}
admin.auth.infrastructure.allow-in-memory-rate-limit-fallback=${ADMIN_ALLOW_IN_MEMORY_RATE_LIMIT_FALLBACK:true}
admin.auth.infrastructure.allow-console-otp-delivery-fallback=${ADMIN_ALLOW_CONSOLE_OTP_DELIVERY_FALLBACK:true}


# =========================
# ADMIN SEED
# =========================
admin.seed.enabled=${ADMIN_SEED_ENABLED:true}
admin.seed.email=${ADMIN_SEED_EMAIL:admin@lexho.com}
admin.seed.password=${ADMIN_SEED_PASSWORD:Admin@123}


# =========================
# CORS
# =========================
app.security.cors.allowed-origins=${APP_ALLOWED_CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4200}
app.security.public-home-read-enabled=${APP_PUBLIC_HOME_READ_ENABLED:false}
app.security.exposure.expose-swagger=${APP_SECURITY_EXPOSE_SWAGGER:true}
app.security.exposure.allow-internal-open=${APP_SECURITY_ALLOW_INTERNAL_OPEN:true}
app.security.exposure.allow-public-customer-read=${APP_SECURITY_ALLOW_PUBLIC_CUSTOMER_READ:true}
app.security.exposure.allow-public-partner-onboarding=${APP_SECURITY_ALLOW_PUBLIC_PROVIDER_ONBOARDING:true}
app.security.exposure.allow-public-admin-profile-content=${APP_SECURITY_ALLOW_PUBLIC_ADMIN_PROFILE_CONTENT:true}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Request diagnostics for upload/network issues
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.multipart=DEBUG
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG
logging.level.org.apache.catalina=DEBUG
logging.level.com.lexho.user_service.config.JwtFilter=DEBUG
logging.level.org.springframework.security.web.FilterChainProxy=DEBUG
