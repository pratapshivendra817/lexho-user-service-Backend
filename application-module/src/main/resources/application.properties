spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# =========================
# DATABASE
# =========================
spring.datasource.url=${LEXHO_DB_URL:${DB_URL:jdbc:mysql://localhost:3306/user_servicedb\
?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}}
spring.datasource.username=${LEXHO_DB_USERNAME:${DB_USERNAME:root}}
spring.datasource.password=${LEXHO_DB_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=${LEXHO_DB_DRIVER_CLASS_NAME:${DB_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}}

spring.jpa.hibernate.ddl-auto=${LEXHO_JPA_HBM2DDL_AUTO:${JPA_HBM2DDL_AUTO:validate}}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.flyway.enabled=${LEXHO_FLYWAY_ENABLED:${FLYWAY_ENABLED:true}}
spring.flyway.locations=classpath:db/migration/application-module,classpath:db/migration/user-service
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.cloud.compatibility-verifier.enabled=false
spring.devtools.restart.enabled=false
spring.output.ansi.enabled=never


