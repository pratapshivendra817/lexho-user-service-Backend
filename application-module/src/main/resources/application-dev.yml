spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/lexho_dev?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  flyway:
    enabled: true

management:
  health:
    mail:
      enabled: false
    rabbit:
      enabled: false

# Local development keeps Redis optional. When it is unavailable, Redis-backed
# caches and rate limits should degrade without becoming the source of truth for
# MySQL-backed business data.

logging:
  level:
    com.lexho: INFO

lexho:
  auth:
    otp:
      log-to-console: true

admin:
  seed:
    enabled: ${ADMIN_SEED_ENABLED:true}
    email: ${ADMIN_SEED_EMAIL:admin@lexho.com}
    password: ${ADMIN_SEED_PASSWORD:Password@123}
  auth:
    rate-limit:
      max-requests: ${ADMIN_LOGIN_RATE_LIMIT_MAX_REQUESTS:100}
      window-seconds: ${ADMIN_LOGIN_RATE_LIMIT_WINDOW_SECONDS:60}
    infrastructure:
      allow-in-memory-otp-fallback: ${ADMIN_ALLOW_IN_MEMORY_OTP_FALLBACK:true}
      allow-console-otp-delivery-fallback: ${ADMIN_ALLOW_CONSOLE_OTP_DELIVERY_FALLBACK:true}
      allow-in-memory-rate-limit-fallback: ${ADMIN_ALLOW_IN_MEMORY_RATE_LIMIT_FALLBACK:true}

app:
  security:
    exposure:
      allow-public-customer-read: true
