spring.application.name=user-service
spring.datasource.url=${USER_SERVICE_DB_URL:jdbc:mysql://localhost:3306/lexho_user_service?\
createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${USER_SERVICE_DB_USERNAME:root}
spring.datasource.password=${USER_SERVICE_DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/user-service
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.jackson.serialization.write-dates-as-timestamps=false
spring.cloud.compatibility-verifier.enabled=false

server.port=${SERVER_PORT:8084}

security.jwt.secret=${JWT_SECRET:12345678901234567890123456789012}
security.jwt.issuer=${JWT_ISSUER:lexho-user-service}
security.jwt.audience=${JWT_AUDIENCE:lexho-clients}
app.security.cors.allowed-origins=${APP_SECURITY_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4200}

calling.timeout-seconds=${CALL_TIMEOUT_SECONDS:30}
calling.ice.stun-url=${WEBRTC_STUN_URL:stun:stun.l.google.com:19302}
calling.ice.turn-url=${WEBRTC_TURN_URL:}
calling.ice.turn-username=${WEBRTC_TURN_USERNAME:}
calling.ice.turn-credential=${WEBRTC_TURN_CREDENTIAL:}

socket.io.enabled=${SOCKET_IO_ENABLED:true}
socket.io.host=${SOCKET_IO_HOST:0.0.0.0}
socket.io.port=${SOCKET_IO_PORT:9092}
