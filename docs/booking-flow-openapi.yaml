openapi: 3.0.3
info:
  title: Lexho Booking Flow API Freeze Contract
  version: "1"
  description: Backend-driven booking, tracking, payment, and subscription contract. Frontend must use meta for UI decisions.
servers:
  - url: /
paths:
  /api/v1/bookings/create:
    post:
      summary: Create instant or scheduled booking
      responses:
        "200":
          description: Booking created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingResponse"
  /api/bookings/details/{bookingId}:
    get:
      summary: Booking details single source of truth
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Booking details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingResponse"
        "404":
          $ref: "#/components/responses/Error"
  /api/bookings/history:
    get:
      summary: Grouped booking history
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Grouped paginated bookings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingHistoryResponse"
  /api/bookings/{bookingId}/reschedule:
    post:
      summary: Reschedule booking
      parameters:
        - name: bookingId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reschedule result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingResponse"
  /api/payments/options:
    get:
      summary: Payment options
      parameters:
        - name: bookingId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Payment options
  /api/payments/create-order:
    post:
      summary: Create Razorpay order
      responses:
        "200":
          description: Razorpay order
  /api/payments/verify:
    post:
      summary: Verify payment
      responses:
        "200":
          description: Payment verification with retryPaymentAllowed
  /api/payments/retry:
    post:
      summary: Retry failed or expired payment
      responses:
        "200":
          description: Retry payment order
  /api/subscriptions:
    get:
      summary: List subscriptions
      responses:
        "200":
          description: Subscription cards with canPause, canResume, canCancel
  /api/subscriptions/{id}:
    get:
      summary: Subscription details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Subscription details with action permissions
  /api/subscriptions/{id}/visits:
    get:
      summary: Subscription visits
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Upcoming, completed, and cancelled visits
  /api/subscriptions/{id}/pause:
    post:
      summary: Pause subscription
      responses:
        "200":
          description: Updated subscription permissions
  /api/subscriptions/{id}/resume:
    post:
      summary: Resume subscription
      responses:
        "200":
          description: Updated subscription permissions
  /api/subscriptions/{id}/cancel:
    post:
      summary: Cancel subscription
      responses:
        "200":
          description: Subscription cancelled
components:
  responses:
    Error:
      description: Machine-readable error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorResponse:
      type: object
      required: [success, code, message]
      properties:
        success:
          type: boolean
          example: false
        code:
          type: string
          enum: [BOOKING_NOT_FOUND, PAYMENT_FAILED, PAYMENT_EXPIRED, SUBSCRIPTION_PAUSED, SUBSCRIPTION_CANCELLED, PARTNER_UNAVAILABLE, TRACKING_DISABLED]
        message:
          type: string
    BookingResponse:
      type: object
      properties:
        success:
          type: boolean
        code:
          type: string
          nullable: true
        message:
          type: string
        data:
          $ref: "#/components/schemas/Booking"
    Booking:
      type: object
      required: [contractVersion, statusHistory, meta]
      properties:
        contractVersion:
          type: integer
          example: 1
        status:
          type: string
        assignmentStatus:
          type: string
        paymentStatus:
          type: string
          enum: [PENDING, SUCCESS, FAILED, EXPIRED, REFUNDED]
        retryPaymentAllowed:
          type: boolean
        statusHistory:
          type: array
          items:
            $ref: "#/components/schemas/StatusHistoryItem"
        map:
          $ref: "#/components/schemas/BookingMap"
        meta:
          $ref: "#/components/schemas/BookingMeta"
    BookingMeta:
      type: object
      required: [trackingScreen, showMap, trackingRefreshSeconds, canCancel, canReschedule, canCallPartner, canTrackPartner, canRaiseIssue]
      properties:
        trackingScreen:
          type: string
          enum: [INSTANT_STATUS, LIVE_TRACKING, PARTNER_ARRIVED, SERVICE_STARTED, SERVICE_IN_PROGRESS, SERVICE_COMPLETED, SCHEDULED_STATUS, SUBSCRIPTION_DETAILS]
        showMap:
          type: boolean
        trackingRefreshSeconds:
          type: integer
        canCancel:
          type: boolean
        canReschedule:
          type: boolean
        canCallPartner:
          type: boolean
        canTrackPartner:
          type: boolean
        canRaiseIssue:
          type: boolean
    BookingMap:
      type: object
      properties:
        enabled:
          type: boolean
        reason:
          type: string
          enum: [PAYMENT_NOT_PAID, TRACKING_NOT_ACTIVE, PARTNER_NOT_ASSIGNED, PARTNER_LOCATION_UNAVAILABLE, UNAVAILABLE]
        partner:
          type: object
          properties:
            latitude:
              type: number
            longitude:
              type: number
    StatusHistoryItem:
      type: object
      properties:
        status:
          type: string
        time:
          type: string
          format: date-time
          example: "2026-06-08T10:55:00Z"
    BookingHistoryResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            instantBookings:
              $ref: "#/components/schemas/PagedItems"
            scheduledBookings:
              $ref: "#/components/schemas/PagedItems"
            subscriptions:
              $ref: "#/components/schemas/PagedItems"
    PagedItems:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
        page:
          type: integer
        size:
          type: integer
        hasMore:
          type: boolean
